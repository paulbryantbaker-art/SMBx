<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: restored 2026-05-02 so the app bleeds edge-
         to-edge behind iOS Safari's translucent URL bar / toolbar (App
         Store look). Was previously omitted because it produced a
         visible "chin" in installed PWA — that chin happened when the
         webview extended past body and html bg didn't match. Compensated
         here by matching html bg to mobile's --mb-bg (#FFFFFF) at runtime
         in V6Mobile, and by safe-area-inset padding on every chrome
         element (TopBar spacer, TabBar bottom, mobile-root paddingBottom).
         If you ever see a colored seam at the bottom in PWA again, check
         html bg + theme-color first. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <title>smbX.ai — Buy-side corporate development</title>
    <meta name="description" content="An on-demand corporate development team that guides your acquisition from thesis to close. We build value by applying operator instincts to the buy-side." />
    <meta property="og:title" content="smbX — Buy-side corporate development" />
    <meta property="og:description" content="An on-demand corporate development team that guides your acquisition from thesis to close. We build value by applying operator instincts to the buy-side." />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="light" />
    <!-- Safari tints BOTH its toolbars from this. It is a compromise value,
         not the page's bone: the top of the page carries the ambient wash
         (jade at the left, amber at the right), so a flat token can only ever
         approximate it — see the measurement in PR #224.
         #EEF6EC was the measured best fit and it made Safari render the BOTTOM
         toolbar flat grey, so the fit has a ceiling somewhere below that. This
         is 40% of the way from bone toward it: closer than bone, well short of
         the value that broke. If grey ever returns, step back toward #FCFAF6
         rather than hunting for the exact threshold. -->
    <meta name="theme-color" content="#FCFAF6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Set body bg synchronously before first paint:
      //  - Desktop V6: #F6F7F9 (slate, avoids white flash)
      //  - Mobile: #D4A258 (warm gold sunrise) so iOS Safari samples it
      //    AT INITIAL PAINT and the chrome stays translucent + warm-tinted.
      //    Critical: do NOT change body bg via JS later — once iOS sees
      //    a JS-driven post-paint bg change, the chrome locks out of
      //    translucent mode into opaque-tinted, killing the page-bleed
      //    behind the status bar. V6Mobile.tsx must NOT touch body bg.
      (function() {
        var isMobile = window.matchMedia && window.matchMedia('(max-width: 767px)').matches;
        // Mobile body bg is white EVERYWHERE so iOS Safari's chrome
        // tint is consistent across the whole app. The home gradient's
        // gold "sunrise" starts just below the safe-area-inset-top zone
        // (in rootGradient, see V6Mobile.tsx) so chrome reads white and
        // the warm depth lives in the page itself, just below the chrome.
        // No body-bg mutation, no per-route reloads, no SPA quirks.
        // Warm paper everywhere (2026-07-17): the logged-out practice site is
        // the first paint most visitors get, and a cool slate/white flash (or
        // slate overscroll edges) read cold against its warm canvas. The app
        // shells paint their own surfaces over this immediately.
        // AURORA 2026-07-31: this is LEDGER.bone, and it has to be kept in
        // step with it by hand — a boot script cannot import a token. It sat
        // two systems stale (the July-17 warmth-pass paper) through the whole
        // Ledger era without anyone seeing it, because a first-paint colour is
        // only visible for one frame and only on a cold load.
        //
        // Deliberately NOT the theme-color above. That value approximates the
        // page's top edge WITH the ambient wash on it; this one is the page's
        // true base, painted before any stylesheet has loaded and therefore
        // before there is a wash to approximate. Matching them would put a
        // tint on a page that has none yet.
        var bg = '#FCFAF6';
        document.documentElement.style.backgroundColor = bg;
        if (document.body) document.body.style.backgroundColor = bg;
        else document.addEventListener('DOMContentLoaded', function() {
          document.body.style.backgroundColor = bg;
        });
      })();
    </script>
    <!-- Site-wide schema: the buy-side practice (THE LINE v2). The retired
         product's SoftwareApplication/offers schema is gone — the site sells
         an advisory practice, not software. Per-page FAQPage / BreadcrumbList
         are injected by usePageMeta. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfessionalService",
          "@id": "https://smbx.ai/#organization",
          "name": "smbX",
          "url": "https://smbx.ai/",
          "logo": "https://smbx.ai/logo-coral-x.png",
          "description": "Buy-side corporate development for acquirers in the lower middle market. A senior operator runs your whole acquisition — thesis to close. Buy-side only, one client per target.",
          "areaServed": "US",
          "founder": { "@type": "Person", "name": "Paul Baker" }
        }
      ]
    }
    </script>
    <!-- Tab icon. These used to point at /X.png and /pwa-icon-*.png, none of
         which existed — the mark was deleted in a logo cleanup and the links
         were never updated, so every browser fell back to its generic
         document glyph. Re-cut from the current mark by
         `npx tsx scripts/studio/build-icons.mts`; run it again if the accent
         colour ever moves, which it has three times. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon-180.png" />
    <!-- iOS home screen. Apple ignores transparency, so this tile is opaque
         bone rather than the dark PWA variant — it reads on both a light and
         a dark home screen, which the near-black tile does not. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Marketing (2026-07 terra redesign): Inter 400–800 is the whole voice; Sora 800
         loaded only for the hero-typeface A/B. Schibsted/Fraunces/JetBrains serve the
         legacy Ramp pages (marketing/legacy/) until they're restyled or retired.
         (Inter Tight dropped 2026-07-10 — nothing renders it.) -->
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..520&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@800&display=swap" rel="stylesheet" />
    <!-- Claude Design fintech UI (cdTokens.css / .cd-root): Figtree = sans + tabular figures, Newsreader = editorial serif headline, IBM Plex Mono = mono -->
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,18..72,400;0,18..72,500;0,18..72,600;1,18..72,400;1,18..72,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
