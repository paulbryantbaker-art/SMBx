<style>
  html, body { margin: 0; height: 100%; background: #0E0F0D; }
  body { display: grid; place-items: center; }
  #stage { position: relative; overflow: hidden; background: #1A1B19; }
  #grid {
    position: absolute; inset: -44px;
    background-image: radial-gradient(rgba(168, 240, 206, .15) 1.4px, transparent 1.4px);
    background-size: 22px 22px; opacity: 0; transition: opacity 1600ms ease;
    animation: drift 120s linear infinite;
  }
  #grid.on { opacity: 1; }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(44px, 44px); } }
  #camera { position: absolute; inset: 0; will-change: transform; transform-origin: 50% 50%; }
  #camera.live { animation: camDrift 46s cubic-bezier(0.4, 0, 0.6, 1) infinite alternate; }
  @keyframes camDrift {
    0%   { transform: scale(1.000) translate3d(0, 0, 0); }
    25%  { transform: scale(1.018) translate3d(-0.5%, 0.25%, 0); }
    50%  { transform: scale(1.032) translate3d(0.4%, -0.3%, 0); }
    75%  { transform: scale(1.018) translate3d(0.5%, 0.3%, 0); }
    100% { transform: scale(1.004) translate3d(-0.35%, -0.2%, 0); }
  }
  #line {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Source Serif 4', Georgia, serif; font-weight: 550; letter-spacing: -0.01em;
    padding: 0 6%; text-align: center;
    /* the standing words and the typed words are ONE paragraph. As sibling
       flex items they were two: when the tag ran to two lines, "We run" sat
       off to the left, vertically centred against a block it was supposed to
       be the first two words of. */
    opacity: 0; transform: translateY(14px);
    transition: opacity 520ms ease, transform 680ms cubic-bezier(0.22, 0.6, 0.24, 1);
  }
  #line.live { opacity: 1; transform: translateY(0); }
  #line .para { display: block; line-height: 1.24; max-width: 92%; }
  /* the five stations. Padding rather than translate, so the paragraph still
     wraps inside the frame wherever it is standing. */
  #line.pl-l  { justify-content: flex-start; padding-left: 10%;  padding-right: 34%; }
  #line.pl-r  { justify-content: flex-end;   padding-right: 10%; padding-left: 34%; }
  #line.pl-lo { align-items: flex-end;   padding-bottom: 24%; }
  #line.pl-hi { align-items: flex-start;  padding-top: 13%; }
  /* Paul: "highlight run only." The verb is the claim — WE RUN it — and
     colouring the pronoun with it spent the emphasis on "We". */
  #line .stand { color: #F4F5F1; white-space: pre; }
  #line .stand em { color: #A8F0CE; font-style: normal; }
  #line .word { color: #F4F5F1; transition: text-shadow 600ms ease; }
  #line .word.lit { text-shadow: 0 0 30px rgba(168, 240, 206, 0.35); }
  #caret {
    display: inline-block; width: 4px; height: 0.92em; margin-left: 8px;
    background: #A8F0CE; align-self: center; animation: caret 1.06s steps(1) infinite;
  }
  @keyframes caret { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* ── the ident layers ── */
  #blackout { position: absolute; inset: 0; background: #0E0F0D; opacity: 1; transition: opacity 240ms ease; pointer-events: none; }
  #blackout.gone { opacity: 0; }
  /* THE THROW. The X is hurled in from upper-left, oversized and canted, and
     decelerates hard onto its exact seat in the lockup — expo-out, the curve
     a thrown object actually follows. It never fades in: it is always solid,
     so the eye tracks one object rather than watching a ghost resolve. */
  #xmark {
    position: absolute; left: 50%; top: 50%; opacity: 1; will-change: transform, filter;
    filter: drop-shadow(0 0 70px rgba(97, 229, 190, 0.5)) drop-shadow(0 0 18px rgba(97, 229, 190, 0.3));
  }
  #xmark.settled { filter: drop-shadow(0 0 26px rgba(97, 229, 190, 0.42)); transition: filter 700ms ease; }
  #lockup {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    opacity: 0; will-change: clip-path, opacity;
    clip-path: inset(0 100% 0 0);
    transition: opacity 260ms ease, transform 900ms cubic-bezier(0.22, 0.6, 0.24, 1), filter 700ms ease;
  }
  #lockup.on { opacity: 1; }
  #lockup.glow { filter: drop-shadow(0 0 34px rgba(97, 229, 190, 0.35)); }
  #lockup.lift { opacity: 0; transform: translate(-50%, -58%) scale(0.955); }
  /* THE LIGHT PASS. Paul, 2026-08-13: "the swoosh through the logo only looks
     like a glitch and not a feature.. it should be full screen and cinematic."
     He is describing a box. The old sweep was sized to the ELEMENT — a
     rectangle of screen-blended gradient laid over the logo, whose own edges
     were visible, which is exactly what a compositing glitch looks like.
     This one spans the whole stage and past it, its gradient is transparent
     at both ends so there is no edge anywhere to see, and it is blurred: a
     bar of light crossing the room, not a panel drawn on top of a logo.
     Second pass, same day: the first full-screen version peaked at 0.58 white
     over a near-black stage, which screen-blends to mid grey across a third of
     the frame — a wash, not a light. The band is narrow now (41–59% of its
     own travel) and peaks at 0.19. */
  .sweep {
    position: absolute; inset: -12%; pointer-events: none; mix-blend-mode: screen; opacity: 0;
    background: linear-gradient(101deg,
      transparent 41%,
      rgba(168, 240, 206, 0.025) 46%,
      rgba(214, 255, 236, 0.10) 49.2%,
      rgba(255, 255, 255, 0.19) 50%,
      rgba(214, 255, 236, 0.10) 50.8%,
      rgba(168, 240, 206, 0.025) 54%,
      transparent 59%);
    background-size: 230% 100%; background-position: 130% 0;
    filter: blur(11px);
  }
  .sweep.go { opacity: 1; background-position: -46% 0; transition: background-position 1180ms cubic-bezier(0.34, 0, 0.22, 1), opacity 240ms ease; }
  .sweep.off { opacity: 0; transition: opacity 460ms ease; }
  #ident-caption {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.32em; color: #8E948B;
    opacity: 0; transition: opacity 400ms ease;
  }
  #ident-caption.on { opacity: 1; }
  /* THE SHOCKWAVE — the struck line, given a job and then taken away.
     Paul, 2026-08-13: "What does this line supposed to do? there is no
     purpose, it is not drawing attention to anything..?" He was looking at a
     grey rule lying across the frame through the logo for two full seconds,
     doing nothing but being there. A line that persists is a frame; a line
     that snaps out of an impact and dissipates is a FORCE. This one exists
     for six tenths of a second, in mint, to say the X hit hard — and then the
     frame is the mark alone, which is what a title card is. */
  .shock { stroke: #A8F0CE; stroke-width: 5; fill: none; stroke-dasharray: 100; stroke-dashoffset: 100;
    filter: drop-shadow(0 0 12px rgba(97, 229, 190, 0.75));
    transition: stroke-dashoffset 210ms cubic-bezier(0.05, 0.85, 0.2, 1), opacity 260ms ease; }
  .shock.draw { stroke-dashoffset: 0; }
  .shock.gone { opacity: 0; }
  #grid.hit { opacity: 1; filter: brightness(2.6); transition: filter 120ms ease; }
  .mpath { stroke: #3A3F38; stroke-width: 2; fill: none; stroke-dasharray: 100; stroke-dashoffset: 100;
    transition: stroke-dashoffset 520ms cubic-bezier(0.3, 0.85, 0.35, 1); }
  .mpath.draw { stroke-dashoffset: 0; }
  .mpath.undraw { stroke-dashoffset: -100; transition-duration: 280ms; opacity: 0; transition-property: stroke-dashoffset, opacity; }
  .mpath.snap { transition-duration: 300ms; }
  .mflow { stroke: #A8F0CE; stroke-width: 2; fill: none; stroke-dasharray: 3 14; opacity: 0;
    transition: opacity 400ms ease 600ms; animation: flow 1.15s linear infinite; }
  .mflow.run { opacity: 0.85; }
  .mflow { transition: opacity 380ms ease 380ms; }
  .mflow:not(.run) { transition: opacity 300ms ease; }
  .mflow.rev { animation-direction: reverse; }
  .mflow.once { transition: opacity 300ms ease; }
  @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -68; } }
  .pill {
    position: absolute; transform: translate(-50%, -50%); transform-origin: 0 50%;
    background: #0A7A58; color: #FCFAF6; white-space: nowrap;
    font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.08em;
    scale: 0 1; opacity: 0;
    transition: scale 340ms cubic-bezier(0.3, 0.85, 0.35, 1), opacity 240ms ease;
  }
  .pill.on { scale: 1 1; opacity: 1; }
  .pill > span { opacity: 0; transition: opacity 280ms ease; display: inline-block; }
  .pill.on > span { opacity: 1; }
  #plate {
    position: absolute; display: inline-flex; align-items: center; gap: 9px;
    font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.1em; color: #8E948B;
    opacity: 0; transition: opacity 900ms ease;
  }
  #plate.on { opacity: 1; }
  #plate i { width: 9px; height: 9px; background: #0A7A58; }
</style>
</head>

  }
  /* THE LOOP, once, after every station has been named — not a break in the
     middle of them. Shown early it would spoil the two beats still to come;
     shown here it is a recap that closes. */
  $line.classList.remove('live');
  await wait(600);                         /* the 520ms fade, finished */
  await orbLoop();
  /* the tag stands centre, wherever the last beat left the words */
  $line.classList.remove('pl-l', 'pl-r', 'pl-lo', 'pl-hi');
  $line.classList.add('live');
  await wait(360);
  for (let c = 1; c <= SPEC.tag.length; c++) { $word.textContent = SPEC.tag.slice(0, c); await wait(Math.round(SPEC.typeMs * 0.66)); }
  $word.classList.add('lit');
  await wait(SPEC.tagHoldMs);
  $word.classList.remove('lit');
  /* HAND-OFF. #line fades over 520ms and this used to wait 420, so the mark
     began arriving under a phrase that was still on screen — the same ghost
     Paul caught in v2, in a new place. Every exit out of #line now clears its
     own duration first, and the text is emptied besides, so there is nothing
     left that COULD ghost if a duration is ever retuned. */
  $line.classList.remove('live');          /* fades — no un-type on the tag */
  await wait(640);
  $word.textContent = ''; $stand.innerHTML = '';
  await endCard();
  window.__done = true;
  await wait(60000);
})();
</script>
</body>
</html>
